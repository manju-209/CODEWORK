name: AWS S3 Deployment

on:
  push:
    branches:
      - main    # Change if you use another branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js (if your app is React/Node)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Build the application
      - name: Build Application
        run: npm run build

      # Step 5: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AKIA2GL6C23NKBLHTMOG }}
          aws-secret-access-key: ${{ secrets.oifqiKHqtbsXw3tQYTHnqDscWLAG6PNVjRF/GD1j }}
          aws-region: ap-south-1   # Change to your AWS region

      # Step 6: Deploy to S3 bucket
      - name: Deploy to S3
        run: aws s3 sync build/ s3://code-site-9-1-2026 --delete
